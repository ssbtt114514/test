name: zip

on:
  workflow_dispatch:  # 手动触发，点击按钮才执行

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 解压并去掉最外层目录
        run: |
          for zipfile in *.zip; do
            # 如果没有 zip 文件，退出
            [ -e "$zipfile" ] || continue
            
            # 解压到临时目录
            unzip "$zipfile" -d temp_extract/
            
            # 检查是否只有一个文件夹
            cd temp_extract
            items=(*)
            if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
              # 只有一个文件夹 -> 移出内容
              mv "${items[0]}"/* ../
              cd ..
              rm -rf temp_extract
            else
              # 多个内容 -> 全部移出
              mv * ../
              cd ..
              rm -rf temp_extract
            fi
            
            # 删除原始 zip
            rm -f "$zipfile"
          done

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "手动解压完成" || echo "无变更需要提交"
          git push